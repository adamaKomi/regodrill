name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test -race ./...
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: v2.18.3
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Build provenance for every release asset. Artifact attestations need a public repository (or GitHub
      # Enterprise Cloud), so this step is skipped while the repository is private.
      # The subjects come from goreleaser's checksums file, with their release names: goreleaser uploads the
      # wasm binary from its build directory, so `dist/*.wasm` matched nothing and v0.1.0 and v0.2.0 attest
      # only the archives and checksums.txt (https://github.com/actions/attest#inputs: subject-checksums).
      - uses: actions/attest-build-provenance@v4
        if: ${{ !github.event.repository.private }}
        with:
          subject-checksums: dist/checksums.txt
